spring:
  application:
    name: domain-core-organization
server:
  port: ${SERVER_PORT:18124}
firefly:
  eda:
    enabled: false
  stepevents:
    enabled: false
  organization:
    branch:
      adapter: sandbox
      core-base-url: http://localhost:8080
management:
  endpoints:
    web:
      exposure:
        include: health,info
