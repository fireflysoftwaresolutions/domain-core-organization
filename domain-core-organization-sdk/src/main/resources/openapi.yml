openapi: 3.0.3
info:
  title: Domain Organization API
  version: 26.10.4
paths:
  /api/v1/branches/{id}:
    get:
      tags: [Branches]
      operationId: read
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchView"
    put:
      tags: [Branches]
      operationId: update
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchDraft"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredBranch"
  /api/v1/branches:
    post:
      tags: [Branches]
      operationId: create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchDraft"
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredBranch"
components:
  schemas:
    BranchView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
    BranchDraft:
      type: object
      additionalProperties: true
    StoredBranch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        body:
          $ref: "#/components/schemas/BranchDraft"
